<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClearHead — Check-in</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .checkin-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }
    .checkin-item:last-child { border-bottom: none; }
    .score-badge {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.8rem;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="container pb-nav">

    <div class="page-header mt-16">
      <h1>Check-in</h1>
    </div>

    <div class="card mb-16">
      <div class="alert" id="alert"></div>

      <form id="checkin-form" onsubmit="handleSubmit(event)">
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="f-date" required />
        </div>

        <div class="form-group">
          <label>Mood <span class="text-muted">(1 = very low · 10 = excellent)</span></label>
          <div class="slider-row">
            <span>1</span>
            <input type="range" id="f-mood" min="1" max="10" value="5"
              oninput="document.getElementById('mood-val').textContent = this.value" />
            <span>10</span>
            <span class="slider-value" id="mood-val">5</span>
          </div>
        </div>

        <div class="form-group">
          <label>Stress <span class="text-muted">(1 = none · 10 = very high)</span></label>
          <div class="slider-row">
            <span>1</span>
            <input type="range" id="f-stress" min="1" max="10" value="5"
              oninput="document.getElementById('stress-val').textContent = this.value" />
            <span>10</span>
            <span class="slider-value" id="stress-val">5</span>
          </div>
        </div>

        <div class="form-group">
          <label>Notes <span class="text-muted">(optional)</span></label>
          <textarea id="f-note" placeholder="How are you feeling today?"></textarea>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">Save Check-in</button>
      </form>
    </div>

    <!-- History -->
    <div class="card">
      <h2 style="margin-bottom:12px;">Recent Check-ins</h2>
      <div id="checkin-list"><p class="text-muted">Loading…</p></div>
    </div>

  </div>

  <!-- Bottom Nav -->
  <nav class="nav">
    <a href="/dashboard.html"><span class="nav-icon">🏠</span>Home</a>
    <a href="/transactions.html"><span class="nav-icon">💳</span>Spend</a>
    <a href="/checkin.html" class="active"><span class="nav-icon">😊</span>Check-in</a>
    <a href="/insights.html"><span class="nav-icon">📊</span>Insights</a>
    <a href="/import.html"><span class="nav-icon">📤</span>Import</a>
  </nav>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    requireAuth();

    document.getElementById("f-date").value = new Date().toISOString().slice(0, 10);

    function showAlert(msg, type = "error") {
      const el = document.getElementById("alert");
      el.textContent = msg;
      el.className = `alert alert-${type} show`;
    }

    function fmtDate(s) {
      return new Date(s).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
    }

    function escHtml(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById("submit-btn");
      btn.textContent = "Saving…";
      btn.disabled = true;

      try {
        await api.createCheckin({
          date:         document.getElementById("f-date").value,
          mood_score:   parseInt(document.getElementById("f-mood").value),
          stress_score: parseInt(document.getElementById("f-stress").value),
          note:         document.getElementById("f-note").value.trim() || null,
        });
        showAlert("Check-in saved!", "success");
        document.getElementById("f-mood").value   = "5";
        document.getElementById("mood-val").textContent = "5";
        document.getElementById("f-stress").value = "5";
        document.getElementById("stress-val").textContent = "5";
        document.getElementById("f-note").value   = "";
        await loadCheckins();
      } catch (err) {
        showAlert(err.message);
      } finally {
        btn.textContent = "Save Check-in";
        btn.disabled = false;
      }
    }

    async function deleteCheckin(id) {
      if (!confirm("Delete this check-in?")) return;
      try {
        await api.deleteCheckin(id);
        await loadCheckins();
      } catch (err) {
        showAlert(err.message);
      }
    }

    async function loadCheckins() {
      try {
        const res = await api.getCheckins();
        const checkins = res.checkins || [];
        const el = document.getElementById("checkin-list");
        if (checkins.length === 0) {
          el.innerHTML = '<p class="text-muted">No check-ins yet.</p>';
          return;
        }
        el.innerHTML = checkins.map(c => `
          <div class="checkin-item">
            <span class="text-muted" style="font-size:0.85rem; min-width:80px;">${fmtDate(c.date)}</span>
            <div style="display:flex; gap:6px; flex:1;">
              <span class="score-badge">Mood ${c.mood_score}</span>
              <span class="score-badge">Stress ${c.stress_score}</span>
            </div>
            ${c.note ? `<span class="text-muted" style="font-size:0.8rem; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escHtml(c.note)}</span>` : ""}
            <button class="btn btn-ghost" style="padding:4px 10px; font-size:0.78rem; width:auto;"
              data-id="${c.id}" onclick="deleteCheckin(this.dataset.id)">✕</button>
          </div>
        `).join("");
      } catch (err) {
        showAlert(err.message);
      }
    }

    loadCheckins();
  </script>
</body>
</html>
